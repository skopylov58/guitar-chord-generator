<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chord Generator</title><script defer="defer" src="bundle.js"></script></head><body><div class="container"><h1>Guitar Chord Generator</h1><div class="card"><form action=""><div class="form-grid"><div class="form-group"><label for="rootNote">Root Note</label> <select id="rootNote"><option value="0">C</option><option value="1">C#</option><option value="2">D</option><option value="3">D#</option><option value="4">E</option><option value="5">F</option><option value="6">F#</option><option value="7">G</option><option value="8">G#</option><option value="9">A</option><option value="10">A#</option><option value="11">B</option></select></div><div class="form-group"><label for="chord">Chord Type</label> <select id="chord"><option value="0,4,7">Major</option><option value="0,3,7">Minor</option><option value="0,3,7,9">Minor 6</option><option value="0,3,7,10">Minor 7</option><option value="0,4,7,9">6</option><option value="0,4,7,10">7</option><option value="0,4,7,11">Major 7</option></select></div><div class="form-group"><label for="tuning">Tuning</label> <select id="tuning"><option value="E A D G B E">Standard (E A D G B E)</option><option value="D A D G B E">Drop D (D A D G B E)</option><option value="D G D G B D">Open G (D G D G B D)</option><option value="D G D G A# D">Open Gm (D G D G A# D)</option><option value="G D G B D">Banjo (G D G B D)</option><option value="G C E A">Ukulele (G C E A)</option><option value="G D A E">Violin (G D A E)</option><option value="C G D A">Cello (C G D A)</option><option value="E A D G">Double Bass (E A D G)</option></select></div><div class="form-group"><label for="length">Frets</label> <select id="length"><option value="3">3</option><option value="4">4</option></select></div><button id="search" class="btn-primary">Show Chords</button></div></form></div><div id="boards"></div><footer><a href="mailto:skopylov@gmail.com">Sergey Kopylov</a><p><a href="https://github.com/skopylov58/guitar-chord-generator">GitHub Project</a></p></footer></div></body></html>
